name: Native coordination
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'jesse/services/coordination_client.py'
      - 'jesse/services/redis.py'
      - 'jesse/services/coordination_runtime.py'
      - 'tests/test_coordination.py'
      - '.github/workflows/native-coordination.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      JESSE_COORDINATION_REQUIRE_TESTS: '1'
      JESSE_COORDINATOR_SOURCE: ${{ github.workspace }}/jesse-rust/coordination
    steps:
      - uses: actions/checkout@v4
      # Source matches the jesse-rust dependency release, which ships first.
      - uses: actions/checkout@v4
        with:
          repository: jesse-ai/jesse-rust
          ref: v1.3.1
          path: jesse-rust
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install pytest
      # Fetch once in CI; the test fixture itself remains offline and fails hard
      # here if the native build is unavailable instead of silently skipping it.
      - run: cargo build --locked --manifest-path jesse-rust/coordination/Cargo.toml
      - run: cargo fmt --manifest-path jesse-rust/coordination/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path jesse-rust/coordination/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path jesse-rust/coordination/Cargo.toml
      - run: python -m pytest tests/test_coordination.py -q
