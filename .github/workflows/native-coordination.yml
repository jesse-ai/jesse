name: Native coordination
on:
  push:
    branches: [master]
  pull_request:
    paths:
      - 'native/coordination/**'
      - 'jesse/services/coordination_client.py'
      - 'jesse/services/redis.py'
      - 'tests/test_coordination.py'
      - '.github/workflows/native-coordination.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      JESSE_COORDINATION_REQUIRE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: python -m pip install pytest
      # Fetch once in CI; the test fixture itself remains offline and fails hard
      # here if the native build is unavailable instead of silently skipping it.
      - run: cargo build --locked --manifest-path native/coordination/Cargo.toml
      - run: cargo fmt --manifest-path native/coordination/Cargo.toml -- --check
      - run: cargo clippy --all-targets --locked --manifest-path native/coordination/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path native/coordination/Cargo.toml
      - run: python -m pytest tests/test_coordination.py -q
